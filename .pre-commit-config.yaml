# Git hooks for this repo, managed by the pre-commit framework.
#
# Do NOT run `pre-commit install`. Hooks are reached through
# `git config core.hooksPath .githooks`, which addons/repo_hooks sets the first
# time the project is opened in the Godot editor, and .githooks/pre-commit runs
# this config when `pre-commit` is on PATH. `pre-commit install` would copy a
# shim into .git/hooks/ that takes precedence and then goes stale.
#
# Optional, to get this config rather than the bare gdlint/gdformat fallback:
#   pip install pre-commit
#
# Useful commands:
#   pre-commit run --all-files    # sweep the whole repo
#   pre-commit autoupdate         # bump `rev` to the latest gdtoolkit release
#   git commit --no-verify        # bypass in an emergency
#
# Notes:
# - pre-commit builds its own isolated venv for gdtoolkit, so contributors do
#   NOT need gdlint/gdformat on their PATH.
# - `rev` is pinned so every dev and CI run agree. CI pins the same release
#   explicitly (`gdtoolkit==4.5.0` in
#   .github/workflows/gdlint-on-pull-request.yml); bump both together. It used to
#   install `gdtoolkit==4.*`, which let a new release reformat files CI had
#   already passed.
# - That workflow runs `gdformat --check` as well as `gdlint`. It has to:
#   `gdlint` has no opinion about indentation, so a file indented entirely with
#   spaces passes it clean and only `gdformat` rejects it.
# - `exclude` is required even though gdlintrc/gdformatrc list `addons` under
#   `excluded_directories`: that setting is ignored when file paths are passed
#   explicitly, and pre-commit always passes explicit staged paths. This mirrors
#   the CI workflow's `files_ignore: 'addons/**'`.

repos:
  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: "4.5.0"
    hooks:
      - id: gdlint
        exclude: '^addons/'
      # --check reports files that need reformatting without rewriting them,
      # so a commit is never silently mutated. Run `gdformat <file>` to fix.
      - id: gdformat
        args: ["--check"]
        exclude: '^addons/'

  - repo: local
    hooks:
      # The same command CI runs -- see the gate step in
      # .github/workflows/validate-gltf-files.yml -- so a model that would fail
      # the build fails the commit instead, before anyone waits on a container.
      #
      # `language: python` rather than `system`: this needs numpy, pyyaml and
      # jsonschema, and the contributors committing models are artists who should
      # not have to curate a Python environment. pre-commit builds an isolated
      # venv, exactly as it does for gdtoolkit above.
      #
      # The versions are pinned to what tools/gltf-validator/Dockerfile installs,
      # so a local verdict and a CI verdict are computed by the same arithmetic.
      # numpy is held below 2.0 there because pyrender needs the 1.x C API.
      - id: validate-models
        name: validate 3D models
        entry: python .github/scripts/validate-model-files.py
        language: python
        additional_dependencies:
          - "numpy==1.26.4"
          - "pyyaml==6.0.2"
          - "jsonschema==4.23.0"
        pass_filenames: true
        # Anchored to the model extension so an unrelated `*.spec.yaml` elsewhere
        # in the repo is not mistaken for a model spec.
        files: '\.(gltf|glb)$|\.(gltf|glb)\.spec\.yaml$'
        # Three directories hold models that are not supposed to pass, so without
        # these exclusions `pre-commit run --all-files` could never be green:
        #
        #   tools/gltf-validator/test-fixtures/  a model that exists in order to
        #                                        fail (unapplied_rotation_90z.gltf)
        #   assets/art/examples/                 validator fixtures named for the
        #                                        check they trip (test_bad_name,
        #                                        test_zup_export, test_poly_budget)
        #                                        plus third-party art that does not
        #                                        follow the naming convention
        #   prototypes/                          "is this loop fun?" prototypes,
        #                                        exempt from shared conventions on
        #                                        purpose -- see CLAUDE.md
        #
        # Every path is anchored, so an `examples` directory somewhere else in the
        # tree is still validated. This previously read `examples/`, which is
        # anchored to the repo root and therefore matched nothing at all.
        exclude: '^(addons/|\.godot/|assets/art/examples/|prototypes/|tools/gltf-validator/test-fixtures/)'
