# The whole asteroid, baked out of the CSG blockout. This is what levels/asteroid_level
# ships and what people work on outside Godot. Regenerated by
# tools/level_design/export_level_model.gd - if a number here fails, check whether the
# level changed on purpose before editing the number.
#
# The extents are generous on purpose. They are the carved rock's bounding box, and
# the validator already allows 10% either way, so they catch a level exported at the
# wrong scale or with a biome missing rather than ordinary design drift.

width: 212.0
height: 68.0
depth: 174.0

up_direction: "+Y"

# Not a real front. A level is entered at the mine mouth and has no facing, but the
# check is INFO-only and the repo's convention is -Z, so this records that nothing
# rotated the export on its way out.
facing_direction: "-Z"

# The blockout carve, not a shipping budget. Raising ROUND_BORE_SIDES or
# CHAMBER_SEGMENTS moves this, and the web build will need a far smaller number than
# either of them once this stops being a blockout.
poly_count_budget: 150000

root_node_name: "sm_level_full_blockout"

# One flat grey rock material. There is nothing textured here yet.
min_material_count: 1

# The collision the level runs on. The shipping level carries this mesh instead of
# carving on load, so the hull the player and the alien mask against is the trimesh
# the -col suffix on the mesh node builds. levels/design/ still carves at runtime, and
# still gets its collision from the CSG combiner.
collision_expected: true
navigation_expected: false
